    <rect id="chain-measurements-box" x="610" y="668" width="555" height="66" rx="9" fill="#EEF7F3" stroke="#32876C" stroke-width="1.8" />
    <text id="chain-measurements-label-0-run-0" x="641.186" y="707.720" font-family="Arial" font-weight="normal" font-size="21.000" fill="#26313B">Four-node chain → gas, throughput and confirmation</text>
  </g>
