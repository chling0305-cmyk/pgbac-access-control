    <polyline id="read-reference-shaft" points="595,165 595,265" fill="none" stroke="#28699B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    <polygon id="read-reference-head" points="595.000,265.000 590.400,255.000 599.600,255.000" fill="#28699B" />
    <text id="read-label-run-0" x="608.000" y="192.000" font-family="Arial" font-weight="normal" font-size="18.000" fill="#586874">read effective state</text>
    <polyline id="deliver-shaft" points="325,315 445,315" fill="none" stroke="#28699B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    <polygon id="deliver-head" points="445.000,315.000 435.000,319.600 435.000,310.400" fill="#28699B" />
    <text id="delivery-label-run-0" x="357.015" y="299.000" font-family="Arial" font-weight="normal" font-size="19.000" fill="#586874">deliver</text>
    <polyline id="admit-shaft" points="745,315 865,315" fill="none" stroke="#28699B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    <polygon id="admit-head" points="865.000,315.000 855.000,319.600 855.000,310.400" fill="#28699B" />
    <text id="admit-label-run-0" x="781.770" y="299.000" font-family="Arial" font-weight="normal" font-size="19.000" fill="#586874">admit</text>
  </g>
  <g id="asynchronous-audit">
