<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="170mm" height="70.83333333333333mm" viewBox="0 0 1200 500" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Governance, local enforcement and asynchronous audit</title>
  <desc id="figure-description">Distinct flows for released policy content, effective governance reference and asynchronous batch roots.</desc>
  <rect id="background" x="0" y="0" width="1200" height="500" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2.5" />
  <g id="governed-reference">
