    <rect id="approval-box" x="25" y="65" width="300" height="100" rx="9" fill="#EDF4F9" stroke="#28699B" stroke-width="2.5" />
    <text id="approval-label-0-run-0" x="51.626" y="107.900" font-family="Arial" font-weight="bold" font-size="20.000" fill="#26313B">Collective policy approval</text>
    <text id="approval-label-1-run-0" x="60.215" y="134.900" font-family="Arial" font-weight="normal" font-size="20.000" fill="#26313B">Release + activation rules</text>
