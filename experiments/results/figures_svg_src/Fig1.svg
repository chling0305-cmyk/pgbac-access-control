    <polyline id="submit-audit-root-shaft" points="1165,450 1185,450 1185,115 1165,115" fill="none" stroke="#32876C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6" />
    <polygon id="submit-audit-root-head" points="1165.000,115.000 1175.000,110.400 1175.000,119.600" fill="#32876C" />
    <text id="async-label-run-0" x="25.000" y="443.000" font-family="Arial" font-weight="normal" font-size="20.000" fill="#32876C">Dashed path: asynchronous audit submission and confirmation</text>
    <text id="overview-note-run-0" x="25.000" y="477.000" font-family="Arial" font-weight="normal" font-size="19.000" fill="#586874">Governance state and policy packages travel on independent paths.</text>
