    <text id="reference-label-0-run-0" x="473.833" y="107.900" font-family="Arial" font-weight="bold" font-size="20.000" fill="#26313B">Effective policy reference</text>
    <text id="reference-label-1-run-0" x="496.606" y="134.900" font-family="Arial" font-weight="normal" font-size="20.000" fill="#26313B">Version + root + count</text>
    <rect id="audit-ledger-box" x="865" y="65" width="300" height="100" rx="9" fill="#EEF7F3" stroke="#32876C" stroke-width="2.5" />
