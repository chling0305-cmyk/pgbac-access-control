    <text id="snapshot-label-0-run-0" x="52.183" y="307.900" font-family="Arial" font-weight="bold" font-size="20.000" fill="#26313B">Released policy snapshot</text>
    <text id="snapshot-label-1-run-0" x="61.597" y="334.900" font-family="Arial" font-weight="normal" font-size="20.000" fill="#26313B">Canonical policy package</text>
    <rect id="admission-box" x="445" y="265" width="300" height="100" rx="9" fill="#EDF4F9" stroke="#28699B" stroke-width="2.5" />
