    <text id="audit-ledger-label-1-run-0" x="916.621" y="134.900" font-family="Arial" font-weight="normal" font-size="20.000" fill="#26313B">Confirmed batch roots</text>
    <polyline id="activate-shaft" points="325,115 445,115" fill="none" stroke="#28699B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    <polygon id="activate-head" points="445.000,115.000 435.000,119.600 435.000,110.400" fill="#28699B" />
    <text id="activate-label-run-0" x="352.260" y="101.000" font-family="Arial" font-weight="normal" font-size="19.000" fill="#586874">activate</text>
