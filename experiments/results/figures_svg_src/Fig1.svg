    <text id="record-and-batch-label-0-run-0" x="884.976" y="456.400" font-family="Arial" font-weight="bold" font-size="20.000" fill="#26313B">Local records → batch root</text>
    <polyline id="local-records-shaft" points="1015,365 1015,420" fill="none" stroke="#32876C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6" />
